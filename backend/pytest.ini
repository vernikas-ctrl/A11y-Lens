[pytest]
# Run pytest from backend/. `pythonpath = .` puts backend/ on sys.path so
# `from app.main import app` resolves without installing the project as a
# package or scattering sys.path hacks through the tests.
pythonpath = .
testpaths = tests

# Fail on an unregistered marker rather than silently skipping the test, and
# show the reason for every non-passing test in the summary.
addopts = --strict-markers -ra
